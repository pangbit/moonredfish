name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RUST_LOG: error
    steps:
      - uses: actions/checkout@v5
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Install verified MoonBit version
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.20+65efd5b93'
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - name: Initialize registry index on a fresh runner
        run: moon update
      - run: moon check --target native --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon build --target native --release --deny-warn
      - run: moon run examples/offline --target native
      - run: moon run examples/hardware --target native
      - run: moon run examples/extended --target native
      - run: python3 tools/test_mock.py
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version: '1.24.0'
          cache-dependency-path: tools/gofish/go.sum
      - name: Compare the common read-only subset with pinned GoFish
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l tools/gofish/*.go)"
          python3 tools/test_gofish.py
          python3 tools/test_extended.py
          python3 tools/test_parity.py
          python3 tools/test_network_config.py
      - run: moon info --target native
      - run: moon fmt --check
      - run: git diff --exit-code
      - run: moon package --list
